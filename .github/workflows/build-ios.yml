name: Build iOS 16 IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile("FinanceLocal-iOS16-source.zip") as z:
              for entry in z.infolist():
                  target = Path(entry.filename.replace("\\", "/"))
                  if entry.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(entry))
          PY
      - name: Test and build IPA
        working-directory: FinanceLocal
        run: bash scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FinanceLocal-iOS16-unsigned
          path: FinanceLocal/build/FinanceLocal-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
